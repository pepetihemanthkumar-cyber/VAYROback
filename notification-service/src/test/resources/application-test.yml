server:
  port: 0

spring:
  application:
    name: NOTIFICATION-SERVICE
  datasource:
    url: jdbc:h2:mem:vayro_notifications_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

app:
  notification:
    admin-email: "admin@vayro.com"
    email:
      enabled: true
      from-name: "VAYRO"
      from-address: "vayro.notifications@gmail.com"
      max-retries: 2
      retry-delay-ms: 50
